[project]
name = "human-sig"
version = "0.1.0"
description = "Benchmark data scraping, processing, and statistical analysis pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jinja2",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "tqdm",
]

[dependency-groups]
plotting = [
    "adjustText",
    "matplotlib",
    "seaborn",
]

scraping = [
    "beautifulsoup4",
    "html5lib",
    "lxml",
    "openpyxl",
    "selenium",
    "webdriver-manager",
]
