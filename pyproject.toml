[project]
name = "human-sig"
version = "0.1.0"
description = "Benchmark data scraping, processing, and statistical analysis pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core dependencies (required for all methods)
    "pandas>=2.3.3",
    # Dependencies for pandas.read_html method
    "html5lib>=1.1",
    "lxml>=6.0.2",
    # Dependencies for Selenium method
    "selenium>=4.0.0",
    "webdriver-manager>=3.8.0",
    # HTML parsing (used in some scenarios)
    "beautifulsoup4>=4.14.3",
    # Statistical analysis dependencies
    "rbo>=0.1.3",
    "scipy>=1.16.3",
    "statsmodels>=0.14.6",
    "seaborn>=0.13.2",
    "openpyxl>=3.1.5",
    "fuzzywuzzy>=0.18.0",
    "python-levenshtein>=0.27.3",
    "jinja2",
]
